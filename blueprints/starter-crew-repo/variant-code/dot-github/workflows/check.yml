name: check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Replace the two steps below with the project's own setup and check command.
      # The command must be the same one that AGENTS.md lists under "Commands".
      - name: Set up
        run: echo "{{install dependencies here}}"
      - name: Run the repository check
        run: "{{npm test}}"
